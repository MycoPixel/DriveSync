name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb
        run: ./packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: dnf install -y rpm-build python3 git
      - name: Build .rpm
        run: ./packaging/build-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm

  appimage:
    runs-on: ubuntu-22.04   # older base -> wider glibc compatibility
    steps:
      - uses: actions/checkout@v4
      - name: Build AppImage
        run: ./packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage

  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder
      - name: Build .flatpak bundle
        # The script adds the Flathub remote and installs the GNOME 46
        # runtime/sdk on first run.
        run: ./packaging/build-flatpak.sh
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: dist/*.flatpak

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install flask requests pytest watchdog ruff pip-audit
      - name: Upgrade build tools
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Audit dependencies
        run: python -m pip_audit
      - name: Lint (fatal errors only)
        run: python -m ruff check --select E9,F63,F7,F82 drivesync tests
      - run: python -m pytest tests/ -q

  gui-smoke:
    # Headless GTK: the unit tests skip the GUI when `gi` is missing, so this
    # job is the only place the real window is built (under a virtual display).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK, PyGObject and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb python3-gi gir1.2-gtk-3.0 \
            python3-pytest python3-flask python3-requests
      - name: Build the window under Xvfb
        run: xvfb-run -a python3 -m pytest tests/test_gui.py -q

  publish:
    needs: [deb, rpm, appimage, flatpak, tests]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum *.deb *.rpm *.AppImage *.flatpak > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          fail_on_unmatched_files: true
