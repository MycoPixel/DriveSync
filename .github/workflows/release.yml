name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb
        run: ./packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: dnf install -y rpm-build python3 git
      - name: Build .rpm
        run: ./packaging/build-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm

  appimage:
    runs-on: ubuntu-22.04   # older base -> wider glibc compatibility
    steps:
      - uses: actions/checkout@v4
      - name: Build AppImage
        run: ./packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install flask requests pytest watchdog ruff pip-audit
      - name: Upgrade build tools
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Audit dependencies
        run: python -m pip_audit
      - name: Lint (fatal errors only)
        run: python -m ruff check --select E9,F63,F7,F82 drivesync tests
      - run: python -m pytest tests/ -q

  publish:
    needs: [deb, rpm, appimage, tests]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
