name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# A re-pushed tag (release fix) supersedes the previous attempt.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare-release:
    # One draft release per tag. Build jobs attach their package straight to
    # it (release assets, not Actions artifacts, so no storage quota), and
    # `publish` flips it public only after every package landed. On
    # workflow_dispatch this job is a no-op and the builds just produce files
    # in their own runners.
    needs: [tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the draft release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft \
              --title "DriveSync $GITHUB_REF_NAME" --generate-notes

  deb:
    needs: [prepare-release, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build .deb
        run: ./packaging/build-deb.sh
      - name: Install and smoke-test the .deb
        # Proves the package's dependencies resolve and the entry point
        # actually starts, not just that dpkg-deb produced a file.
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/*.deb
          drivesync --version
      - name: Attach .deb to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber

  rpm:
    needs: [prepare-release, tests]
    runs-on: ubuntu-latest
    # Pinned to a concrete release: `latest` silently changed Python (and
    # therefore the package's site-packages path) between runs.
    container: fedora:43
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        run: dnf install -y rpm-build python3 git gh
      - name: Build .rpm
        run: ./packaging/build-rpm.sh
      - name: Install and smoke-test the .rpm
        run: |
          dnf install -y ./dist/*.rpm
          drivesync --version
      - name: Attach .rpm to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.rpm --clobber

  appimage:
    needs: [prepare-release, tests]
    runs-on: ubuntu-22.04   # older base -> wider glibc compatibility
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build AppImage
        run: ./packaging/build-appimage.sh
      - name: Smoke-test the AppImage
        # No FUSE on runners: extract-and-run exercises the bundled CPython.
        run: APPIMAGE_EXTRACT_AND_RUN=1 ./dist/*.AppImage --version
      - name: Attach AppImage to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.AppImage --clobber

  flatpak:
    needs: [prepare-release, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder elfutils
      - name: Build .flatpak bundle
        # The script adds the Flathub remote and installs the GNOME 46
        # runtime/sdk on first run.
        run: ./packaging/build-flatpak.sh
      - name: Attach .flatpak to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.flatpak --clobber

  tests:
    runs-on: ${{ matrix.python-version == '3.10' && 'ubuntu-22.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the locked runtime and test tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.lock pytest ruff pip-audit
      - name: Audit the app's dependencies
        # Audit the exact versions the lock installs; auditing requirements
        # ranges can silently resolve to a different set than we ship.
        if: matrix.python-version == '3.14'
        run: python -m pip_audit -r requirements.lock
      - name: Lint
        # Rule set lives in pyproject.toml so local runs and CI agree.
        run: python -m ruff check drivesync tests
      - run: python -m pytest tests/ -q

  gui-smoke:
    # Headless GTK: the unit tests skip the GUI when `gi` is missing, so this
    # job is the only place the real window is built (under a virtual display).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GTK, PyGObject and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb python3-gi gir1.2-gtk-3.0 \
            python3-pytest python3-flask python3-requests
      - name: Build the window under Xvfb
        run: xvfb-run -a python3 -m pytest tests/test_gui.py -q

  publish:
    needs: [deb, rpm, appimage, flatpak]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write          # OIDC for the provenance attestation
      attestations: write
    steps:
      - name: Download the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$GITHUB_REF_NAME" --dir dist --clobber
      - name: Generate a CycloneDX SBOM
        # Machine-readable inventory of the pinned runtime dependencies, so
        # a user or scanner can check what a release actually ships.
        run: |
          python3 -m pip install --quiet cyclonedx-bom
          cyclonedx-py requirements requirements.lock \
            --output-file dist/sbom.cdx.json
      - name: Attest build provenance
        # Signed by GitHub's OIDC identity, so users can verify a download
        # was produced by this workflow and tag.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.flatpak
            dist/sbom.cdx.json
      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum *.deb *.rpm *.AppImage *.flatpak > SHA256SUMS
          cat SHA256SUMS
      - name: Upload checksums and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/SHA256SUMS \
            dist/sbom.cdx.json --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
