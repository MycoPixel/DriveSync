name: dependency audit

# The release workflow audits the lockfile once per tag. A weekly run catches
# a new advisory against an already-published version without waiting for the
# next release.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install pip-audit
        run: python -m pip install --quiet pip-audit
      - name: Audit the shipped lockfile
        run: python -m pip_audit -r requirements.lock
