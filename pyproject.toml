[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drivesync"
version = "0.2.0"
description = "Google Drive sync client for Linux desktops with a local web dashboard"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["flask>=2.2", "requests>=2.28"]

[project.scripts]
drivesync = "drivesync.cli:main"

[tool.setuptools.packages.find]
include = ["drivesync*"]

[tool.setuptools.package-data]
drivesync = ["static/*"]
