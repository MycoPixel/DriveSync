[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drivesync"
# single source of truth: drivesync/__init__.__version__ (the build scripts
# read it directly; setuptools derives the sdist/wheel version from it too)
dynamic = ["version"]
description = "Google Drive sync client for Linux desktops with a local web dashboard"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["flask>=2.2", "requests>=2.28"]

[project.optional-dependencies]
watch = ["watchdog>=4.0"]
tray = ["pystray", "pillow"]
gui = ["PyGObject"]
fuse = ["fusepy>=3.0"]
all = ["watchdog>=4.0", "pystray", "pillow", "PyGObject", "fusepy>=3.0"]

[project.scripts]
drivesync = "drivesync.cli:main"

[tool.setuptools.packages.find]
include = ["drivesync*"]

[tool.setuptools.dynamic]
version = { attr = "drivesync.__version__" }

[tool.setuptools.package-data]
drivesync = ["static/*"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["dist", "build"]

[tool.ruff.lint]
# Fatal errors plus the cheap correctness checks that catch real bugs
# (unused/duplicate names, mutable default args). Broader style rules would
# add noise without adding safety.
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841", "B006"]
