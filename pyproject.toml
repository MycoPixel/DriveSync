[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drivesync"
version = "0.5.1"
description = "Google Drive sync client for Linux desktops with a local web dashboard"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["flask>=2.2", "requests>=2.28"]

[project.optional-dependencies]
watch = ["watchdog>=4.0"]
tray = ["pystray", "pillow"]
gui = ["PyGObject"]
all = ["watchdog>=4.0", "pystray", "pillow", "PyGObject"]

[project.scripts]
drivesync = "drivesync.cli:main"

[tool.setuptools.packages.find]
include = ["drivesync*"]

[tool.setuptools.package-data]
drivesync = ["static/*"]
